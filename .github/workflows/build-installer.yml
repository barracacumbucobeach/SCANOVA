name: Build Installer

# Constrói o SCANOVA.App e o instalador (MSI) em um runner Windows de verdade — necessário
# porque nem o compilador XAML do Windows App SDK nem o WiX Toolset rodam em Linux/macOS (ver
# docs/BUILD.md e docs/INSTALLER.md). Só roda quando disparado manualmente (workflow_dispatch),
# nunca a cada push, para não consumir minutos de Actions sem necessidade.
on:
  workflow_dispatch:
    inputs:
      product_version:
        description: "Versão do instalador (major.minor.build)"
        required: false
        default: "1.0.0"

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publicar SCANOVA.App (win-x64, autocontido)
        # -p:Platform=x64 precisa ir explícito na linha de comando, mesmo o win-x64.pubxml já
        # declarando <Platform>x64</Platform> (github.com/microsoft/WindowsAppSDK discussions
        # #3026) — sem isso, o Platform da avaliação inicial do projeto cai para "AnyCPU" antes
        # do pubxml ser importado. Corrige a avaliação (confirmado: o caminho intermediário passa
        # a ter "obj\x64\Release\..." em vez de "obj\Release\..."), mas sozinho NÃO basta — ver o
        # passo seguinte para o resto do problema (resources.pri/.xbf ainda ficavam de fora do
        # publish mesmo assim).
        run: dotnet publish src/SCANOVA.App -c Release -p:PublishProfile=win-x64 -p:Platform=x64

      - name: DIAGNÓSTICO — mapear tudo que o publish gerou (.pri/.xbf em todo o repo)
        # Três tentativas seguidas (Platform=x64, cópia manual, .resw mínimo) não resolveram --
        # cada uma partia de uma hipótese sobre ONDE/COMO o resources.pri deveria aparecer, mas
        # nenhuma foi confirmada contra a realidade do build. Este passo não corrige nada: só
        # lista, em todo o workspace (não só src/SCANOVA.App/bin), qualquer *.pri e *.xbf, e a
        # árvore completa da pasta de publish -- inclusive testando a hipótese de o arquivo se
        # chamar diferente de "resources.pri" (ex.: SCANOVA.pri, nomeado pelo AssemblyName, comum
        # em apps "Unpackaged" sem identidade de pacote). Sempre roda (continue-on-error via `;
        # exit 0` no fim), pra aparecer no log mesmo se o passo seguinte falhar de novo.
        shell: pwsh
        run: |
          Write-Host "===== Todo *.pri no workspace ====="
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "*.pri" -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName, Length, LastWriteTime | Format-Table -AutoSize | Out-String -Width 300 | Write-Host

          Write-Host "===== Todo *.xbf no workspace (primeiros 30) ====="
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "*.xbf" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 30 FullName | Format-Table -AutoSize | Out-String -Width 300 | Write-Host

          Write-Host "===== Árvore completa de bin\publish\win-x64 ====="
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "src\SCANOVA.App\bin\publish\win-x64"
          Get-ChildItem -Path $publishDir -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300 | Write-Host

          Write-Host "===== Árvore completa de bin\x64\Release (fora de publish) ====="
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "src\SCANOVA.App\bin\x64\Release"
          Get-ChildItem -Path $releaseDir -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300 | Write-Host

      - name: Copiar resources*.pri e .xbf para a pasta publicada
        # Bug conhecido e ainda sem correção definitiva do próprio Windows App SDK, para apps
        # WinUI 3 "Unpackaged": `dotnet publish` gera o .pri e as páginas .xbf normalmente na
        # pasta de BUILD (bin\x64\Release\...), mas não os copia para a pasta de PUBLISH —
        # confirmado contra builds reais: SCANOVA.exe abria sem nenhuma janela em runtime
        # (XamlParseException em MainWindow.InitializeComponent()). Busca por "*.pri" (não mais
        # só o nome exato "resources.pri" -- apps Unpackaged sem identidade de pacote podem gerar
        # um nome baseado no AssemblyName, ex. SCANOVA.pri) e copia com o MESMO NOME de arquivo
        # que o WinUI 3 espera encontrar (resources.pri), já que é esse o nome que
        # Application.LoadComponent busca via ms-appx:// independente de como foi gerado.
        shell: pwsh
        run: |
          $appBin = Join-Path $env:GITHUB_WORKSPACE "src\SCANOVA.App\bin"
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "src\SCANOVA.App\bin\publish\win-x64"

          $sourcePri = Get-ChildItem -Path $appBin -Filter "*.pri" -Recurse |
              Where-Object { $_.FullName -notlike "*\publish\*" } |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $sourcePri) { throw "Nenhum *.pri foi encontrado na pasta de build (fora de publish\) -- ver o passo de diagnóstico acima." }
          Copy-Item $sourcePri.FullName (Join-Path $publishDir "resources.pri") -Force
          Write-Host "Copiado: $($sourcePri.FullName) -> $publishDir\resources.pri"

          $sourceRoot = $sourcePri.DirectoryName
          $xbfFiles = Get-ChildItem -Path $sourceRoot -Filter "*.xbf" -Recurse
          foreach ($xbf in $xbfFiles) {
              $relative = $xbf.FullName.Substring($sourceRoot.Length).TrimStart('\')
              $dest = Join-Path $publishDir $relative
              $destDir = Split-Path $dest -Parent
              if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Force -Path $destDir | Out-Null }
              Copy-Item $xbf.FullName $dest -Force
          }
          Write-Host "Copiados $($xbfFiles.Count) arquivo(s) .xbf de $sourceRoot -> $publishDir"

      - name: Compilar o instalador (WiX)
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "src\SCANOVA.App\bin\publish\win-x64\"
          dotnet build installer/SCANOVA.Installer/SCANOVA.Installer.wixproj -c Release `
            -p:AppPublishDir="$publishDir" `
            -p:ProductVersion="${{ github.event.inputs.product_version }}"

      - name: Gerar checksum e preparar artefato
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "installer/SCANOVA.Installer" -Filter "SCANOVA-Setup.msi" -Recurse |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi) { throw "SCANOVA-Setup.msi não foi encontrado depois do build." }

          $hash = Get-FileHash -Path $msi.FullName -Algorithm SHA256
          $checksumLine = "$($hash.Hash.ToLowerInvariant())  SCANOVA-Setup.msi"

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item $msi.FullName "dist/SCANOVA-Setup.msi"
          $checksumLine | Out-File -FilePath "dist/SCANOVA-Setup.msi.sha256" -Encoding ascii -NoNewline

      - name: Publicar artefato do instalador
        uses: actions/upload-artifact@v4
        with:
          name: SCANOVA-Setup
          path: dist/
          if-no-files-found: error
